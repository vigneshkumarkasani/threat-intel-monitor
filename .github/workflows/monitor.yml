name: Threat Intel Monitor

on:
  schedule:
    - cron: "*/20 * * * *"  # every 20 minutes (backup to cron-job.org); busy times can delay a run
  workflow_dispatch:        # adds a "Run workflow" button so you can test it any time
    inputs:
      force_digest:
        description: "Send the daily digest now"
        type: boolean
        default: false

permissions:
  contents: write           # lets the job save a daily backup of seen.json to the repo

concurrency:
  group: threat-intel-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Get the code
        uses: actions/checkout@v5   # latest commit only: fast, and doesn't slow down as backups pile up

      - name: Load the bot's memory
        uses: actions/cache/restore@v4
        with:
          path: seen.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Run the monitor
        timeout-minutes: 11         # stop the script itself in time for its memory to be saved below
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # provided by GitHub automatically, for its API
          FORCE_DIGEST: ${{ inputs.force_digest }}
        run: python3 monitor.py      # the runner already has Python 3; the script needs nothing else

      - name: Save the bot's memory
        if: always()                 # even if the run failed or was cut short, keep what it already sent
        uses: actions/cache/save@v4
        with:
          path: seen.json
          key: state-${{ github.run_id }}

      - name: Publish dashboard data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f feed.json ] || { echo "No dashboard data this run"; exit 0; }
          dir=$(mktemp -d)
          cp feed.json "$dir/"
          cd "$dir"
          git init -q -b dashboard-data
          git config user.name "threat-intel-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json
          git commit -q -m "Dashboard data"
          # A single commit, replaced every run, so this branch never builds up history
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dashboard-data

      - name: Daily backup to the repo
        run: |
          # monitor.py leaves a "backup_due" file about once every 20 hours
          [ -f backup_due ] || { echo "No backup due this run"; exit 0; }
          git config user.name "threat-intel-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          if git diff --cached --quiet; then
            echo "Nothing new to back up"
            exit 0
          fi
          git commit -q -m "Daily backup of seen items"
          git push -q || { git pull -q --rebase --depth=1 && git push -q; } || echo "Backup push failed; will try again tomorrow"

      - name: Warn on Telegram if this run failed
        # Sends at most about one warning an hour (only from runs in the first 20 minutes of the hour)
        if: failure() || cancelled()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          [ -n "$TOKEN" ] || exit 0
          if [ "$MANUAL" != "true" ] && [ "$(date -u +%M)" -ge 20 ]; then
            echo "A warning was already sent this hour"; exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=⚠️ Threat Intel Monitor: a run failed or was cut short, so alerts may be delayed. Details: ${RUN_URL}" \
            > /dev/null || true
