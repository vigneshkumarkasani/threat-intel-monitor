name: Threat Intel Monitor

on:
  schedule:
    - cron: "7,27,47 * * * *"  # every 20 min, off the busy :00 mark (backup to cron-job.org); GitHub may still delay or skip runs
  workflow_dispatch:           # adds a "Run workflow" button; cron-job.org also starts runs this way
    inputs:
      force_digest:
        description: "Send the daily digest now"
        type: boolean
        default: false

permissions:
  contents: write              # lets the job save the bot's memory and the dashboard data to branches

concurrency:
  group: threat-intel-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - name: Get the code
        uses: actions/checkout@v5   # latest commit only: fast

      # The bot's memory (seen.json) lives on its own branch, "bot-memory", which holds a single
      # commit that is replaced at the end of every run. This is more reliable than GitHub's cache.
      - name: Load the bot's memory
        id: memory
        run: |
          for attempt in 1 2 3; do
            if git fetch -q --depth=1 "$REMOTE" bot-memory 2>/dev/null; then
              git show FETCH_HEAD:seen.json > seen.json
              echo "Memory loaded from the bot-memory branch"
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          code=0
          git ls-remote --exit-code --heads "$REMOTE" bot-memory > /dev/null 2>&1 || code=$?   # 2 = branch doesn't exist
          if [ "$code" -eq 2 ]; then
            echo "No bot-memory branch yet: this is the first run with branch memory"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            # The memory exists but couldn't be read. Running with old memory would repeat alerts, so stop.
            echo "::error::Could not load the bot's memory; skipping this run to avoid repeat alerts"
            exit 1
          fi

      - name: Bring over the memory from the old cache (first run only)
        if: steps.memory.outputs.found == 'false'
        uses: actions/cache/restore@v4
        with:
          path: seen.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Run the monitor
        timeout-minutes: 11         # stop the script in time for its memory to be saved below
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # provided by GitHub automatically, for its API
          FORCE_DIGEST: ${{ inputs.force_digest }}
        run: python3 monitor.py      # the runner already has Python 3; the script needs nothing else

      - name: Save the bot's memory
        # Runs even if the monitor failed or was cut short, so what it already sent is remembered.
        # Skipped only when the memory couldn't be loaded (saving then would overwrite good memory).
        if: always() && steps.memory.outcome == 'success'
        run: |
          [ -f seen.json ] || { echo "No memory file to save"; exit 0; }
          dir=$(mktemp -d)
          cp seen.json "$dir/"
          cd "$dir"
          git init -q -b bot-memory
          git config user.name "threat-intel-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git commit -q -m "Bot memory"
          for attempt in 1 2 3 4; do
            git push -q --force "$REMOTE" bot-memory && { echo "Memory saved"; exit 0; }
            echo "Save attempt $attempt failed, retrying"
            sleep $((attempt * 5))
          done
          echo "::error::Could not save the bot's memory"
          exit 1

      - name: Publish dashboard data
        run: |
          [ -f feed.json ] || { echo "No dashboard data this run"; exit 0; }
          dir=$(mktemp -d)
          cp feed.json "$dir/"
          cd "$dir"
          git init -q -b dashboard-data
          git config user.name "threat-intel-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json
          git commit -q -m "Dashboard data"
          # A single commit, replaced every run, so this branch never builds up history
          git push -q --force "$REMOTE" dashboard-data || echo "Dashboard data not published this run"

      - name: Warn on Telegram if this run failed
        # Sends at most about one warning an hour (only from runs in the first 20 minutes of the hour)
        if: failure() || cancelled()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TOKEN" ] || exit 0
          if [ "$(date -u +%M)" -ge 20 ]; then
            echo "Only one warning per hour is sent"; exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=⚠️ Threat Intel Monitor: a run failed or was cut short, so alerts may be delayed. Details: ${RUN_URL}" \
            > /dev/null || true
